name: LidarScan
options:
  bundleIdPrefix: com.zaiah.lidarscan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  LidarScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LidarScan
        excludes:
          - "Info.plist"
    info:
      path: LidarScan/Info.plist
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: SceneKit.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: LidarScan
        PRODUCT_BUNDLE_IDENTIFIER: com.zaiah.lidarscan
        INFOPLIST_FILE: LidarScan/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
