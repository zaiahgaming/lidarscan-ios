name: Build & Release LidarScan

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project LidarScan.xcodeproj \
            -scheme LidarScan \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload into Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "LidarScan.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          # Merge the checked-in plist into the built plist. Existing resolved
          # bundle values win; declared app capabilities and privacy strings are restored.
          APP_PLIST="Payload/LidarScan.app/Info.plist"
          python3 - <<'PY'
          import plistlib

          app_path = "Payload/LidarScan.app/Info.plist"
          source_path = "LidarScan/Info.plist"
          with open(app_path, "rb") as stream:
              built = plistlib.load(stream)
          with open(source_path, "rb") as stream:
              declared = plistlib.load(stream)
          for key, value in declared.items():
              built.setdefault(key, value)
          # Enforce privacy and file-sharing declarations from the source plist.
          for key in ("NSCameraUsageDescription", "NSLocalNetworkUsageDescription",
                      "NSBonjourServices", "UIFileSharingEnabled",
                      "LSSupportsOpeningDocumentsInPlace"):
              built[key] = declared[key]
          with open(app_path, "wb") as stream:
              plistlib.dump(built, stream, fmt=plistlib.FMT_XML, sort_keys=False)
          PY
          plutil -lint "$APP_PLIST"
          plutil -p "$APP_PLIST"
          for key in NSCameraUsageDescription NSLocalNetworkUsageDescription UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace NSBonjourServices; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP_PLIST" >/dev/null
          done
          zip -qr LidarScan-unsigned.ipa Payload
          ls -lh LidarScan-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LidarScan-unsigned
          path: LidarScan-unsigned.ipa
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" LidarScan-unsigned.ipa \
            --title "LidarScan ${{ github.ref_name }}" \
            --generate-notes
